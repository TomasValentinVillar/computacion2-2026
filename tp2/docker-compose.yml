services:
  api:                        # nombre del servicio
    build: .                  # construir la imagen con el Dockerfile de esta carpeta
    ports:
      - "8000:8000"           # puerto_host:puerto_contenedor -> la API queda accesible desde el host
    volumes:
      - ./datos:/app/datos    # carpeta del host montada: el volcado sobrevive a "down"
    environment:
      - DIR_ESTADO=/app/datos
